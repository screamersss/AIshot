[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aishot"
version = "0.1.0"
description = "ИИ-помощник, решающий задачи по скриншоту (grim+slurp -> локальная vision-LLM -> уведомление). Linux/Wayland/niri."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aishot = "aishot.cli:main"

[tool.setuptools]
packages = ["aishot"]
